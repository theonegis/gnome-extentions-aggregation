name: three-finger-drag

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gnome-three-finger-drag
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libinput-dev shellcheck
      - name: Build shim
        run: make
      - name: Check shell scripts
        run: shellcheck install.sh uninstall.sh
